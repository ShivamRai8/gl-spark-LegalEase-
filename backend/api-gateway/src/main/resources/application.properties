spring.application.name=api-gateway
server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**

spring.cloud.gateway.routes[1].id=case-service
spring.cloud.gateway.routes[1].uri=lb://case-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/cases/**

spring.cloud.gateway.routes[2].id=evidence-service
spring.cloud.gateway.routes[2].uri=lb://evidence-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/evidence/**,/uploads/**

spring.cloud.gateway.routes[3].id=audit-service
spring.cloud.gateway.routes[3].uri=lb://audit-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/audit/**

jwt.secret=ThisIsMyVeryLongSecretKeyForLegalEaseApplicationThatIsMoreThanSixtyFourCharactersLong123456789
